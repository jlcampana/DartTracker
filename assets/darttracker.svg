<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base con forma de squircle, como los iconos de macOS -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- rejilla de patrón de tracker -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="18" y="20" width="22" height="3" rx="1.5"/><rect x="46" y="20" width="14" height="3" rx="1.5"/><rect x="66" y="20" width="22" height="3" rx="1.5"/><rect x="94" y="20" width="14" height="3" rx="1.5"/>
    <rect x="18" y="28" width="14" height="3" rx="1.5"/><rect x="46" y="28" width="22" height="3" rx="1.5"/><rect x="74" y="28" width="14" height="3" rx="1.5"/><rect x="94" y="28" width="14" height="3" rx="1.5"/>
    <rect x="18" y="36" width="22" height="3" rx="1.5"/><rect x="46" y="36" width="14" height="3" rx="1.5"/><rect x="66" y="36" width="14" height="3" rx="1.5"/><rect x="94" y="36" width="10" height="3" rx="1.5"/>
    <rect x="18" y="44" width="10" height="3" rx="1.5"/><rect x="46" y="44" width="22" height="3" rx="1.5"/><rect x="74" y="44" width="22" height="3" rx="1.5"/>
    <rect x="18" y="52" width="22" height="3" rx="1.5"/><rect x="46" y="52" width="10" height="3" rx="1.5"/><rect x="66" y="52" width="14" height="3" rx="1.5"/><rect x="94" y="52" width="14" height="3" rx="1.5"/>
    <rect x="18" y="60" width="14" height="3" rx="1.5"/><rect x="46" y="60" width="22" height="3" rx="1.5"/><rect x="74" y="60" width="10" height="3" rx="1.5"/><rect x="94" y="60" width="14" height="3" rx="1.5"/>
    <rect x="18" y="68" width="22" height="3" rx="1.5"/><rect x="46" y="68" width="14" height="3" rx="1.5"/><rect x="66" y="68" width="22" height="3" rx="1.5"/><rect x="94" y="68" width="10" height="3" rx="1.5"/>
  </g>
  <!-- fila del cursor de reproducción -->
  <rect x="14" y="42.5" width="100" height="6" rx="3" fill="#0a84ff" fill-opacity="0.28"/>

  <!-- nota musical (corcheas unidas) -->
  <g filter="url(#glow)" fill="url(#note)">
    <path d="M52 26 L92 18 L92 66 L84 66 L84 30 L60 34.8 L60 74 L52 74 Z"/>
    <ellipse cx="45" cy="75" rx="11" ry="8.5" transform="rotate(-20 45 75)"/>
    <ellipse cx="77" cy="67" rx="11" ry="8.5" transform="rotate(-20 77 67)"/>
  </g>

  <!-- vúmetro LED -->
  <g>
    <rect x="22" y="96" width="7" height="12" rx="2" fill="#30d158"/>
    <rect x="31" y="92" width="7" height="16" rx="2" fill="#30d158"/>
    <rect x="40" y="88" width="7" height="20" rx="2" fill="#6fd441"/>
    <rect x="49" y="94" width="7" height="14" rx="2" fill="#30d158"/>
    <rect x="58" y="86" width="7" height="22" rx="2" fill="#b5d62a"/>
    <rect x="67" y="90" width="7" height="18" rx="2" fill="#ffd60a"/>
    <rect x="76" y="84" width="7" height="24" rx="2" fill="#ffd60a"/>
    <rect x="85" y="92" width="7" height="16" rx="2" fill="#ff9f0a"/>
    <rect x="94" y="88" width="7" height="20" rx="2" fill="#ff453a"/>
  </g>

  <!-- brillo superior -->
  <rect x="6" y="6" width="116" height="58" rx="28" fill="url(#gloss)"/>
</svg>
